name: Build and Deploy to GitHub Pages

on:
  # Runs on pushes to main branch
  push:
    branches: [ main ]
  
  # Allows you to run this workflow manually
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Download existing sports data from Pages
        continue-on-error: true
        run: |
          echo "🔍 Attempting to preserve existing sports data..."
          # Try to download existing BYU data
          curl -f -o sportsData/BYUSports$(date +%Y-%m-%d).json \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sportsData/BYUSports$(date +%Y-%m-%d).json" || \
            echo "No current BYU data found"
          
          # Try to download existing BSU data
          curl -f -o sportsData/BSUSports$(date +%Y-%m-%d).json \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sportsData/BSUSports$(date +%Y-%m-%d).json" || \
            echo "No current BSU data found"
          
          # Try to download yesterday's data as backup
          curl -f -o sportsData/BYUSports$(date -d "yesterday" +%Y-%m-%d).json \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sportsData/BYUSports$(date -d "yesterday" +%Y-%m-%d).json" || \
            echo "No yesterday BYU data found"
          
          curl -f -o sportsData/BSUSports$(date -d "yesterday" +%Y-%m-%d).json \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sportsData/BSUSports$(date -d "yesterday" +%Y-%m-%d).json" || \
            echo "No yesterday BSU data found"
          
          echo "📁 Current sportsData directory:"
          ls -la sportsData/ || echo "sportsData directory not found"
        
      - name: Scrape fresh sports data (if needed)
        run: |
          echo "🕐 Starting deployment scrape check at: $(date)"
          
          # Check if we have today's data files
          TODAY=$(date +%Y-%m-%d)
          BYU_FILE="sportsData/BYUSports${TODAY}.json"
          BSU_FILE="sportsData/BSUSports${TODAY}.json"
          
          NEED_BYU=false
          NEED_BSU=false
          
          if [ ! -f "$BYU_FILE" ]; then
            echo "❌ Missing today's BYU data file: $BYU_FILE"
            NEED_BYU=true
          else
            echo "✅ Found today's BYU data file: $BYU_FILE"
          fi
          
          if [ ! -f "$BSU_FILE" ]; then
            echo "❌ Missing today's BSU data file: $BSU_FILE" 
            NEED_BSU=true
          else
            echo "✅ Found today's BSU data file: $BSU_FILE"
          fi
          
          # Only scrape what we need
          if [ "$NEED_BYU" = true ]; then
            echo "🏈 Scraping missing BYU sports data..."
            npm run scrape-byu
          fi
          
          if [ "$NEED_BSU" = true ]; then
            echo "🐎 Scraping missing BSU sports data..."
            npm run scrape-bsu
          fi
          
          if [ "$NEED_BYU" = false ] && [ "$NEED_BSU" = false ]; then
            echo "🎉 All sports data is current - no scraping needed!"
          fi
          
          echo "📁 Final sportsData directory:"
          ls -la sportsData/ || echo "sportsData directory not found"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository for project pages
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4